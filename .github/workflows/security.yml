name: Security

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'scripts/secret-scan.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and secret audit (self-hosted VPS)
    runs-on: [self-hosted, Linux, X64, azimara-mesh]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use preinstalled Bun
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: bun run security:scan

      - name: Audit production dependency tree (blocking)
        # The project's lockfile is bun.lock. Generating a synthetic
        # package-lock.json for npm audit reports phantom advisories from a
        # different resolution graph; audit the real installed tree instead.
        run: bun audit --audit-level=critical

      - name: Report lower-severity advisories (non-blocking)
        continue-on-error: true
        run: bun audit

      - name: Check for tracked runtime state
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.session-secret$'; then
            echo "::error::Repository contains runtime state or environment files"
            exit 1
          fi
