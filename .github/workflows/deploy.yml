name: Deploy

# Manual only: a production deployment is a deliberate act. CI must be green
# before this workflow is dispatched.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      ref:
        description: 'Git ref to deploy (commit SHA or tag)'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-azimara-mesh
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }} (self-hosted VPS)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: 'file:./ci.db'
      SESSION_SECRET: 'ci-only-session-secret-not-for-production'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Verify typecheck and tests before release
        run: |
          bun run typecheck
          bun run test
          bun run security:scan

      - name: Build standalone artifact
        run: bun run build

      - name: Install artifact and restart service
        env:
          MESH_ENV: ${{ secrets.MESH_ENV }}
          TARGET_DIR: /home/ubuntu/azimara-mesh-app
          SERVICE_NAME: azimara-mesh
        run: bash scripts/vps-deploy.sh
