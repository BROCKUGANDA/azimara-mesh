<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AZIMARA MESH">
  <defs>
    <linearGradient id="core" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#5D8CFF"/>
    </linearGradient>
    <linearGradient id="mesh" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.55" stop-color="#5D8CFF"/>
      <stop offset="1" stop-color="#42D9E8"/>
    </linearGradient>
  </defs>
  <!-- dark geometric outer structure -->
  <polygon points="32,2 62,32 32,62 2,32" fill="none" stroke="#2A3A56" stroke-width="2"/>
  <!-- rotated square connecting the four agent nodes -->
  <polygon points="32,12 52,32 32,52 12,32" fill="none" stroke="#2A3A56" stroke-width="1.5"/>
  <!-- mesh pathways -->
  <g stroke="url(#mesh)" stroke-width="1.6" opacity="0.85">
    <line x1="32" y1="32" x2="32" y2="12"/>
    <line x1="32" y1="32" x2="52" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="52"/>
    <line x1="32" y1="32" x2="12" y2="32"/>
  </g>
  <!-- central coordination diamond -->
  <polygon points="32,21.5 42.5,32 32,42.5 21.5,32" fill="url(#core)"/>
  <polygon points="32,25 39,32 32,39 25,32" fill="#0B1020" opacity="0.55"/>
  <!-- four autonomous agent nodes -->
  <circle cx="32" cy="12" r="4.5" fill="#8B7CFF" stroke="#0B1020" stroke-width="1.5"/>
  <circle cx="52" cy="32" r="4.5" fill="#5D8CFF" stroke="#0B1020" stroke-width="1.5"/>
  <circle cx="32" cy="52" r="4.5" fill="#42D9E8" stroke="#0B1020" stroke-width="1.5"/>
  <circle cx="12" cy="32" r="4.5" fill="#39C7B2" stroke="#0B1020" stroke-width="1.5"/>
</svg>
