name: azimara-mesh-data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesh
      POSTGRES_USER: mesh_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the protected environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mesh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh_bootstrap -d mesh"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true

volumes:
  mesh-postgres:
